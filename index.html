<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafbf8" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('minefield-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#14160f' : '#fafbf8');
        } catch (error) { document.documentElement.dataset.theme = 'light'; }
      })();
    </script>
    <meta name="description" content="A little logic. A lot of possibility. Play Minefield, a fresh take on Minesweeper with Classic, Blitz, Zen, and daily challenges. Free, offline-ready, and made for your next little break." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Minefield — Make your next move.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
