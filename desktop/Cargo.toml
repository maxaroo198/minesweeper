[package]
name = "minefield-desktop"
version = "1.1.0"
description = "Minefield — a calm minesweeper playground (desktop shell)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
